# ============================================================================
# GitHub Actions - v5 CI（push main/master + PR）
# ============================================================================
# 设计要点（v4 教训 → v5 对策）：
#   - 发布流水线零测试门禁（v4）→ 本 CI 是硬门禁：ruff + 全量 pytest，失败即红；
#   - 矩阵 Python 3.10 / 3.12（下限 3.10 = pyproject requires-python，上限对齐发布构建的 3.12）；
#   - pip install -e ".[dev]" 若因平台/工具链问题失败，退回「非 editable 安装 + PYTHONPATH=src」，
#     保证测试在任何情况下都能跑起来（测试跑不了 = 假绿，比红更危险）；
#   - concurrency 取消同分支旧 run，省 runner 额度；
#   - 权限最小化：顶层 contents: read，本 workflow 无任何写操作。
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖（editable 失败退回 PYTHONPATH=src）
        run: |
          python -m pip install --upgrade pip
          if pip install -e ".[dev]"; then
            echo "[ci] editable 安装成功"
          else
            echo "::warning::pip install -e .[dev] 失败，退回非 editable 安装 + PYTHONPATH=src"
            pip install ".[dev]"
            echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          fi

      - name: ruff check src tests
        run: ruff check src tests

      - name: pytest 全量（离线 mock，规格书铁律 3）
        run: python -m pytest -q

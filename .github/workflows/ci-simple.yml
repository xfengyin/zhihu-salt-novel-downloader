# ============================================================================
# GitHub Actions - 极简 v4 单元测试 CI（simple/ 目录）
# ============================================================================
# 触发条件：
#   - push 到 master（仅 simple/ 或本 workflow 变更时）
#   - 针对 master 的 PR（仅 simple/ 或本 workflow 变更时）
#
# 设计要点：
#   - setup-python 3.12（与 release-simple.yml 的发布版本保持一致）
#   - 依赖来源单一：`pip install -r requirements.txt` 装运行时依赖
#   - requirements.txt 不含测试依赖，workflow 内额外 `pip install pytest`
#   - `pip install -e ./simple`（PEP 660, hatchling）保证从源码导入 zhihu_downloader
#   - 权限最小化：顶层 contents: read，不做任何写操作
# ============================================================================

name: CI Simple v4 (pytest)

on:
  push:
    branches: [master]
    paths:
      - 'simple/**'
      - '.github/workflows/ci-simple.yml'
  pull_request:
    branches: [master]
    paths:
      - 'simple/**'
      - '.github/workflows/ci-simple.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: pytest (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: simple/requirements.txt

      - name: 安装依赖（运行时依赖 + pytest + 包本体）
        working-directory: simple
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e .

      - name: 运行测试
        working-directory: simple
        run: python -m pytest -q

      - name: 验证 CLI
        working-directory: simple
        run: python -m zhihu_downloader --help

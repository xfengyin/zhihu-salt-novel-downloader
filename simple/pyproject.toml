[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhihu-salt-novel-downloader-simple"
version = "4.3.0"
description = "知乎盐选小说下载器（极简 v4）"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "ebooklib>=0.18",
]

[project.scripts]
zhihu-downloader = "zhihu_downloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["zhihu_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
